name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source-formula-and-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run validators and smoke tests
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/lint_markdown_contracts.py
          python3 scripts/test_skills.py
          python3 scripts/test_release_assets.py

      - name: Derive release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build source archive
        run: |
          mkdir -p dist/release
          python3 scripts/build_source_archive.py \
            --version "${{ steps.version.outputs.value }}" \
            --output dist/release/altfins-ai-skills-src.tar.gz \
            --sha256-file dist/release/altfins-ai-skills-src.sha256

      - name: Render Homebrew formula
        run: |
          SHA=$(cat dist/release/altfins-ai-skills-src.sha256)
          python3 scripts/render_homebrew_formula.py \
            --version "${{ steps.version.outputs.value }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/altfins-ai-skills-src.tar.gz" \
            --sha256 "$SHA" \
            --output dist/release/altfins-skills.rb

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/release/altfins-ai-skills-src.tar.gz dist/release/altfins-skills.rb --clobber

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "Missing required secret HOMEBREW_TAP_GITHUB_TOKEN" >&2
            exit 1
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/altfins-com/homebrew-tap.git" dist/homebrew-tap
          cp dist/release/altfins-skills.rb dist/homebrew-tap/Formula/altfins-skills.rb
          cd dist/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/altfins-skills.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update altfins-skills ${RELEASE_VERSION}"
          git push origin HEAD:main

  windows-bundle:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Run validators and smoke tests
        run: |
          python scripts/validate_skills.py
          python scripts/lint_markdown_contracts.py
          python scripts/test_skills.py
          python scripts/test_release_assets.py

      - name: Derive release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows ZIP
        run: python scripts/build_windows_bundle.py --version ${{ steps.version.outputs.value }}

      - name: Upload Windows release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/release/altfins-skills-windows.zip --clobber
